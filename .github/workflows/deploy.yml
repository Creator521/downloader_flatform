name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Step 1: Clean Docker reinstall (removes ALL old versions) ────────
      - name: Fix Docker installation on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "=== Removing old/conflicting Docker packages ==="
            sudo apt-get remove -y \
              docker \
              docker-engine \
              docker.io \
              docker-compose \
              docker-doc \
              podman-docker \
              containerd \
              runc 2>/dev/null || true

            # Remove any standalone legacy docker-compose binary
            sudo rm -f /usr/local/bin/docker-compose

            echo "=== Installing Docker CE from official repo ==="
            # Use || true so third-party repo GPG errors (e.g. Caddy) don't abort the script
            sudo apt-get update -y -q || true
            sudo apt-get install -y -q ca-certificates curl gnupg lsb-release

            sudo install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
              sudo gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg
            sudo chmod a+r /etc/apt/keyrings/docker.gpg

            echo \
              "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
              https://download.docker.com/linux/ubuntu \
              $(lsb_release -cs) stable" | \
              sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

            # Again || true to handle any unrelated repo GPG issues
            sudo apt-get update -y -q || true
            sudo apt-get install -y -q \
              docker-ce \
              docker-ce-cli \
              containerd.io \
              docker-buildx-plugin \
              docker-compose-plugin

            echo "=== Restarting Docker daemon ==="
            # Stop socket first to avoid conflict from old docker.io socket
            sudo systemctl stop docker.socket || true
            sudo systemctl stop docker || true
            sudo systemctl daemon-reload
            sudo systemctl start docker
            sleep 5

            echo "=== Verifying — only ONE docker binary should exist ==="
            which docker
            docker version
            echo ""
            docker compose version

      # ── Step 2: Deploy ────────────────────────────────────────────────────
      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/downloader
            git pull origin main
            chmod +x deploy.sh
            bash deploy.sh
