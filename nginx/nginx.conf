events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Caching Path
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=1g inactive=60m use_temp_path=off;

    upstream app_server {
        server app:8000;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;
        http2 on;

        # Gzip Compression (aggressive)
        gzip on;
        gzip_comp_level 6;
        gzip_min_length 256;
        gzip_vary on;
        gzip_proxied any;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml
            application/xml+rss
            application/x-javascript
            image/svg+xml;

        # Brotli Compression (~15-25% better than gzip for text)
        # Requires ngx_brotli module: https://github.com/google/ngx_brotli
        brotli on;
        brotli_comp_level 6;
        brotli_min_length 256;
        brotli_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml
            application/xml+rss
            application/x-javascript
            image/svg+xml;

        # Static Files - Long cache + immutable
        location /static/ {
            alias /app/frontend/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Blog & SEO Pages - Cached
        location / {
            proxy_pass http://app_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache Configuration for GET requests
            proxy_cache my_cache;
            proxy_cache_valid 200 60m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            
            # Don't cache API POST requests (default behavior, but being explicit is good)
            # proxy_cache_methods GET HEAD;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # API Endpoints - No Cache for Action, Cache for Preview if needed
        location /preview {
            proxy_pass http://app_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Previews are cached by Redis in backend, Nginx shouldn't cache POST aggressively unless safe
        }
        
        location /download {
            proxy_pass http://app_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off; # Important for streaming!
        }
    }
}
