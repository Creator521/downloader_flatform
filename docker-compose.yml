version: '3.8'

services:
  app:
    build: .
    container_name: video_downloader
    restart: always
    environment:
      - WORKERS=8
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./temp:/app/temp
      - ./app/templates:/app/app/templates # Hot reload for templates
      - ./proxies.txt:/app/proxies.txt
      - ./cookies.txt:/app/cookies.txt
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: video_downloader_redis
    restart: always
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    container_name: video_downloader_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/app/frontend:ro # Serve static files directly
    depends_on:
      - app

volumes:
  redis_data:
