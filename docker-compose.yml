services:
  app:
    build: .
    container_name: video_downloader
    restart: always
    environment:
      - WORKERS=4
      - DOMAIN_NAME=https://snapreeldownload.com
      - REDIS_URL=redis://redis:6379/0
      # AdSense review mode: disables all Monetag scripts (ad tag + push SW)
      # and removes its domains from the CSP. Remove this line (or set to
      # "true") after AdSense approval to re-enable Monetag revenue.
      - MONETAG_ENABLED=false
    ports:
      - "5001:8000"
    volumes:
      - ./temp:/app/temp
      - ./proxies.txt:/app/proxies.txt
      - ./cookies.txt:/app/cookies.txt
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  redis:
    image: redis:alpine
    container_name: video_downloader_redis
    restart: always
    volumes:
      - redis_data:/data

volumes:
  redis_data:
